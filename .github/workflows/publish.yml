name: Publish (pypi)

on:
  release:
    types:
      - created

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: release
      url: https://pypi.org/p/bq-inspector
      deployment: true
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: bq-inspector
      PYTHON_NAME_SPACE: bq_inspector
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          pip install -r requirements.setup.txt
      - name: Publish
        run: |
          bash dev/publish.sh "pypi"

  test-published-package:
    needs:
      - publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: bq-inspector
      PYTHON_NAME_SPACE: bq_inspector
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
      # It takes some time when the package gets available.
      - name: Sleep
        run: |
          sleep 30
      - name: Install package
        run: |
          python3 -m pip install -U "${{ env.PYTHON_PACKAGE_NAME}}"
      # uv is installed only in the publish job; smoke-test the PyPI wheel via pip's python.
      - name: Test package
        run: |
          python -m "${{ env.PYTHON_NAME_SPACE }}"
