[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  ".git",
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  ".pyright",
  ".pytest_cache",
  ".github",
  ".trunk",
  "dev",
  "src/bq_inspector/tests",
  "dist",
  ".python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bq_inspector"]

[project]
name = "bq-inspector"
version = "0.2.0"
authors = [{ name = "yu-iskw" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10.0"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
description = "Read-only BigQuery and Knowledge Catalog inspection CLI for AI agents"
dependencies = [
  "click",
  "google-cloud-bigquery",
  "google-auth",
  "jsonschema",
  "typing_extensions",
  "google-cloud-datacatalog-lineage>=0.7.0",
  "google-cloud-dataplex>=2.20.0",
]

[project.scripts]
bq-inspector = "bq_inspector.cli:main"

[tool.pytest.ini_options]
testpaths = ["src/bq_inspector/tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "xenon>=0.9.3",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0",
  "bandit>=1.8.3",
  "ruff>=0.15.0",
  "pyright>=1.1.0",
  "pylint>=3.3.5",
  "vulture>=2.16",
  "ssort>=0.16.0",
]

[tool.pyright]
include = ["src"]
exclude = ["src/bq_inspector/tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = "warning"

[[tool.pylint.overrides]]
module = "bq_inspector.core.shared.types"
disable = "invalid-name"

[[tool.pylint.overrides]]
module = "bq_inspector.input.parsed_input_types"
disable = "invalid-name"

[[tool.pylint.overrides]]
module = "bq_inspector.__main__"
disable = "invalid-name"

[tool.vulture]
paths = ["src/bq_inspector"]
min_confidence = 80

[tool.coverage.run]
branch = true
source = ["src/bq_inspector"]

[tool.coverage.report]
show_missing = true
omit = ["*/tests/*"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
